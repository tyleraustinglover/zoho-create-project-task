<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Project Task - VERSION 8</title>

    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #202124;
            background: #ffffff;
        }

        .wrap {
            max-width: 650px;
            margin: auto;
            padding: 25px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        .readonly {
            padding: 11px 12px;
            background: #f6f7f9;
            border: 1px solid #d9dde3;
            border-radius: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #c8cdd5;
            border-radius: 6px;
            font: inherit;
            background: #ffffff;
            color: #202124;
        }

        /* Task Name must always remain editable */
        #taskName {
            cursor: text;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
            opacity: 1;
            background: #ffffff;
        }

        #taskName:focus {
            outline: 2px solid #2f63e9;
            outline-offset: 1px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        #cancel {
            background: white;
            border: 1px solid #c8cdd5;
        }

        #create {
            background: #2f63e9;
            color: white;
            border: 1px solid #2f63e9;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
        }


        #dynamicFields {
            margin-top: 4px;
        }

        .dynamic-field {
            margin-top: 16px;
        }

        .dynamic-field > label {
            margin-top: 0;
        }

        .checkbox-group {
            display: grid;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid #c8cdd5;
            border-radius: 6px;
            background: #ffffff;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-option input {
            width: auto;
            margin: 0;
        }

        .field-help {
            margin-top: 6px;
            font-size: 12px;
            color: #5f6368;
        }

        .error {
            color: #b3261e;
        }

        .success {
            color: #137333;
        }

        .diagnostic {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .diagnostic h3 {
            margin: 0 0 10px;
            font-size: 14px;
        }

        #debug {
            background: #f6f7f9;
            border: 1px solid #d9dde3;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="wrap">

    <h2>Create Project Task</h2>

    <label>Opportunity</label>
    <div id="oppName" class="readonly">Loading...</div>

    <label for="taskName">Task Name *</label>
    <input
        type="text"
        id="taskName"
        name="taskName"
        placeholder="Enter task name..."
        autocomplete="off"
    >

    <label for="project">Project *</label>
    <select id="project" disabled>
        <option value="">Loading active projects...</option>
    </select>

    <div id="dynamicFields"></div>

    <label for="notes">Notes</label>
    <textarea
        id="notes"
        placeholder="Enter notes or instructions for the task..."></textarea>

    <label for="projectFiles">Project Files</label>
    <input
        type="file"
        id="projectFiles"
        multiple
    >
    <div class="field-help">
        Select one or more files to attach to the task. File submission will be enabled in the next backend step.
    </div>

    <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="create" type="button" disabled>Create Task</button>
    </div>

    <div id="status"></div>

    <div class="diagnostic">
        <h3>Diagnostic Information</h3>
        <div id="debug">Waiting for Zoho...</div>
    </div>

</div>

<script>

let opportunityId = "";
let opportunityName = "";
let currentLayoutFields = [];

const $ = id => document.getElementById(id);


/* =================================
   DIAGNOSTIC LOGGER
================================= */

function debug(label, value) {

    let text;

    try {
        text = JSON.stringify(value, null, 2);
    }
    catch (e) {
        text = String(value);
    }

    $("debug").textContent +=
        "\n\n--- " + label + " ---\n" + text;
}


function status(message, type = "") {

    $("status").className = type;
    $("status").textContent = message || "";

}


function getId(value) {

    if (Array.isArray(value)) {
        return String(value[0] || "");
    }

    return String(value || "");
}


/* =================================
   PARSE FUNCTION RESPONSE
================================= */

function parseFunction(response) {

    debug("RAW FUNCTION RESPONSE", response);

    let output = null;

    if (
        response &&
        response.details &&
        response.details.output !== undefined
    ) {
        output = response.details.output;
    }

    else if (
        response &&
        response.details !== undefined
    ) {
        output = response.details;
    }

    else {
        output = response;
    }

    if (typeof output === "string") {

        try {
            return JSON.parse(output);
        }

        catch (e) {

            debug(
                "FUNCTION OUTPUT WAS NOT JSON",
                output
            );

            return {
                message: output
            };
        }
    }

    return output || {};
}


/* =================================
   PAGE LOAD
================================= */

ZOHO.embeddedApp.on(
    "PageLoad",
    async function(data) {

        $("debug").textContent =
            "Widget PageLoad event received.";

        debug(
            "PAGELOAD DATA FROM ZOHO",
            data
        );

        try {

            /* -------------------------
               FIND OPPORTUNITY ID
            -------------------------- */

            opportunityId =
                getId(
                    data.EntityId ||
                    data.EntityID ||
                    data.RecordId ||
                    data.RecordID ||
                    data.id
                );

            debug(
                "DETECTED OPPORTUNITY ID",
                opportunityId
            );

            if (!opportunityId) {

                throw new Error(
                    "Zoho did not provide an Opportunity ID."
                );

            }


            /* -------------------------
               DETECT MODULE
            -------------------------- */

            const entity =
                data.Entity ||
                data.EntityName ||
                "Deals";

            debug(
                "DETECTED ENTITY",
                entity
            );


            /* -------------------------
               GET CRM OPPORTUNITY
            -------------------------- */

            const recordResponse =
                await ZOHO.CRM.API.getRecord({

                    Entity: entity,
                    RecordID: opportunityId

                });

            debug(
                "CRM RECORD RESPONSE",
                recordResponse
            );

            const record =
                recordResponse &&
                recordResponse.data &&
                recordResponse.data[0]
                    ? recordResponse.data[0]
                    : {};

            opportunityName =
                record.Deal_Name ||
                record.Opportunity_Name ||
                record.Name ||
                "Opportunity";

            $("oppName").textContent =
                opportunityName;


            /* -------------------------
               DEFAULT TASK NAME
            -------------------------- */

            /*
             * Copy the Opportunity Name into Task Name.
             *
             * IMPORTANT:
             * We do NOT disable the Task Name field.
             * The user can freely change this value.
             */

            $("taskName").value =
                opportunityName;

            debug(
                "OPPORTUNITY NAME",
                opportunityName
            );

            debug(
                "DEFAULT TASK NAME",
                $("taskName").value
            );


            /* =================================
               GET ACTIVE PROJECTS
            ================================= */

            debug(
                "CALLING FUNCTION",
                "get_active_projects"
            );

            const projectResponse =
                await ZOHO.CRM.FUNCTIONS.execute(
                    "get_active_projects",
                    {
                        arguments:
                            JSON.stringify({})
                    }
                );

            debug(
                "GET ACTIVE PROJECTS RESPONSE",
                projectResponse
            );

            const payload =
                parseFunction(
                    projectResponse
                );

            debug(
                "PARSED PROJECT RESPONSE",
                payload
            );

            let projects = null;

            if (
                payload &&
                Array.isArray(payload.projects)
            ) {

                projects =
                    payload.projects;

            }

            else if (
                Array.isArray(payload)
            ) {

                projects =
                    payload;

            }

            if (!projects) {

                throw new Error(
                    "Could not load active Zoho Projects."
                );

            }


            /* -------------------------
               BUILD PROJECT DROPDOWN
            -------------------------- */

            $("project").innerHTML =
                '<option value="">Select a project...</option>';

            projects
                .sort(
                    (a, b) =>
                        String(a.name)
                            .localeCompare(
                                String(b.name)
                            )
                )
                .forEach(
                    project => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            String(project.id);

                        option.textContent =
                            project.name;

                        $("project")
                            .appendChild(
                                option
                            );

                    }
                );

            $("project").disabled =
                false;

            $("create").disabled =
                false;

            status(
                "Projects loaded successfully.",
                "success"
            );

        }

        catch (error) {

            debug(
                "PAGELOAD ERROR",
                {
                    message:
                        error.message,

                    stack:
                        error.stack
                }
            );

            if (!opportunityName) {

                $("oppName").textContent =
                    "Unable to load Opportunity";

            }

            status(
                error.message ||
                String(error),
                "error"
            );

        }

    }
);


/* =================================
   DYNAMIC PROJECT FIELDS
================================= */

function clearDynamicFields() {
    currentLayoutFields = [];
    $("dynamicFields").innerHTML = "";
}


function renderDynamicFields(fields) {

    clearDynamicFields();

    if (!Array.isArray(fields)) {
        return;
    }

    /*
     * These are the project-facing fields we want to show
     * in Version 7. Internal assignment fields such as
     * Designers and Contact remain hidden.
     */
    const visibleApiNames = [
        "request_type",
        "urgent_status",
        "project_details"
    ];

    currentLayoutFields = fields.filter(
        field => visibleApiNames.includes(field.api_name)
    );

    currentLayoutFields.forEach(field => {

        const wrapper = document.createElement("div");
        wrapper.className = "dynamic-field";

        const label = document.createElement("label");
        label.textContent =
            field.display_name + (field.required ? " *" : "");

        wrapper.appendChild(label);

        if (
            field.type === "multipicklist" &&
            Array.isArray(field.options)
        ) {

            const group = document.createElement("div");
            group.className = "checkbox-group";

            field.options.forEach(optionValue => {

                const optionLabel =
                    document.createElement("label");

                optionLabel.className = "checkbox-option";

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.value = optionValue;
                checkbox.dataset.dynamicField = field.api_name;

                if (
                    field.default_value &&
                    optionValue === field.default_value
                ) {
                    checkbox.checked = true;
                }

                optionLabel.appendChild(checkbox);
                optionLabel.appendChild(
                    document.createTextNode(optionValue)
                );

                group.appendChild(optionLabel);
            });

            wrapper.appendChild(group);
        }

        else if (
            field.type === "picklist" &&
            Array.isArray(field.options)
        ) {

            const select = document.createElement("select");
            select.dataset.dynamicField = field.api_name;

            if (!field.required) {
                const blank = document.createElement("option");
                blank.value = "";
                blank.textContent = "Select...";
                select.appendChild(blank);
            }

            field.options.forEach(optionValue => {

                const option = document.createElement("option");
                option.value = optionValue;
                option.textContent = optionValue;

                if (
                    field.default_value &&
                    optionValue === field.default_value
                ) {
                    option.selected = true;
                }

                select.appendChild(option);
            });

            wrapper.appendChild(select);
        }

        else if (field.type === "multiline") {

            const textarea = document.createElement("textarea");
            textarea.dataset.dynamicField = field.api_name;
            textarea.placeholder =
                "Enter " + field.display_name.toLowerCase() + "...";

            wrapper.appendChild(textarea);
        }

        else {

            const input = document.createElement("input");
            input.type = "text";
            input.dataset.dynamicField = field.api_name;

            if (field.default_value) {
                input.value = field.default_value;
            }

            wrapper.appendChild(input);
        }

        $("dynamicFields").appendChild(wrapper);
    });
}


async function loadProjectLayout(projectId) {

    clearDynamicFields();

    if (!projectId) {
        status("");
        return;
    }

    status("Loading project fields...");

    debug(
        "CALLING PROJECT LAYOUT FUNCTION",
        {
            function: "get_project_task_layout",
            projectId: projectId
        }
    );

    const response =
        await ZOHO.CRM.FUNCTIONS.execute(
            "get_project_task_layout",
            {
                arguments:
                    JSON.stringify({
                        projectId: projectId
                    })
            }
        );

    debug(
        "GET PROJECT TASK LAYOUT RESPONSE",
        response
    );

    const payload =
        parseFunction(response);

    debug(
        "PARSED PROJECT TASK LAYOUT",
        payload
    );

    if (!payload || payload.success === false) {
        throw new Error(
            (payload && payload.message) ||
            "Could not load the selected project's task fields."
        );
    }

    renderDynamicFields(payload.fields || []);

    status(
        "Project fields loaded successfully.",
        "success"
    );
}


$("project").addEventListener(
    "change",
    async function() {

        const projectId =
            $("project").value;

        try {
            await loadProjectLayout(projectId);
        }

        catch (error) {

            debug(
                "PROJECT LAYOUT ERROR",
                {
                    message: error.message,
                    stack: error.stack
                }
            );

            clearDynamicFields();

            status(
                error.message || String(error),
                "error"
            );
        }
    }
);


function validateDynamicFields() {

    for (const field of currentLayoutFields) {

        if (!field.required) {
            continue;
        }

        const selector =
            '[data-dynamic-field="' +
            field.api_name +
            '"]';

        const controls =
            Array.from(
                document.querySelectorAll(selector)
            );

        let hasValue = false;

        if (field.type === "multipicklist") {
            hasValue =
                controls.some(
                    control => control.checked
                );
        }

        else {
            hasValue =
                controls.some(
                    control =>
                        String(
                            control.value || ""
                        ).trim() !== ""
                );
        }

        if (!hasValue) {
            return field.display_name;
        }
    }

    return "";
}


function getDynamicFieldValues() {

    const values = {};

    currentLayoutFields.forEach(field => {

        const selector =
            '[data-dynamic-field="' +
            field.api_name +
            '"]';

        const controls =
            Array.from(
                document.querySelectorAll(selector)
            );

        if (field.type === "multipicklist") {

            values[field.column_name] =
                controls
                    .filter(
                        control => control.checked
                    )
                    .map(
                        control => control.value
                    );
        }

        else {

            values[field.column_name] =
                controls[0]
                    ? controls[0].value
                    : "";
        }
    });

    return values;
}


/* =================================
   CREATE TASK
================================= */

$("create").addEventListener(
    "click",
    async function() {

        /*
         * Read whatever Task Name is currently
         * in the editable field.
         */
        const taskName =
            $("taskName").value.trim();

        const projectId =
            $("project").value;

        const notes =
            $("notes").value.trim();


        if (!taskName) {

            status(
                "Please enter a Task Name.",
                "error"
            );

            $("taskName").focus();

            return;
        }


        if (!projectId) {

            status(
                "Please select a project.",
                "error"
            );

            return;
        }


        const missingDynamicField =
            validateDynamicFields();

        if (missingDynamicField) {

            status(
                "Please complete " +
                missingDynamicField +
                ".",
                "error"
            );

            return;
        }

        const dynamicFieldValues =
            getDynamicFieldValues();

        const selectedFiles =
            Array.from(
                $("projectFiles").files || []
            );

        debug(
            "DYNAMIC FIELD VALUES",
            dynamicFieldValues
        );

        debug(
            "SELECTED PROJECT FILES",
            selectedFiles.map(file => ({
                name: file.name,
                size: file.size,
                type: file.type
            }))
        );


        /*
         * Disable buttons/project while submitting.
         *
         * Task Name intentionally remains editable.
         */

        $("create").disabled =
            true;

        $("cancel").disabled =
            true;

        $("project").disabled =
            true;

        $("notes").disabled =
            true;

        $("projectFiles").disabled =
            true;

        document
            .querySelectorAll("[data-dynamic-field]")
            .forEach(control => {
                control.disabled = true;
            });


        status(
            "Creating task..."
        );


        debug(
            "CREATE TASK REQUEST",
            {
                opportunityId:
                    opportunityId,

                taskName:
                    taskName,

                projectId:
                    projectId,

                notes:
                    notes,
                            customFields: JSON.stringify(dynamicFieldValues)
            }
        );


        try {

            const response =
                await ZOHO.CRM.FUNCTIONS.execute(
                    "create_project_task_widget",
                    {
                        arguments:
                            JSON.stringify({

                                opportunityId:
                                    opportunityId,

                                taskName:
                                    taskName,

                                projectId:
                                    projectId,

                                notes:
                                    notes

                            })
                    }
                );

            debug(
                "CREATE TASK RAW RESPONSE",
                response
            );

            const result =
                parseFunction(
                    response
                );

            debug(
                "CREATE TASK PARSED RESPONSE",
                result
            );


            if (
                result.success === false ||
                result.error
            ) {

                throw new Error(
                    result.message ||
                    result.error ||
                    "Task creation failed."
                );

            }


            status(
                result.message ||
                "Project task created successfully.",
                "success"
            );

        }


        catch (error) {

            debug(
                "CREATE TASK ERROR",
                {
                    message:
                        error.message,

                    stack:
                        error.stack
                }
            );

            status(
                error.message ||
                String(error),
                "error"
            );

            $("create").disabled =
                false;

            $("cancel").disabled =
                false;

            $("project").disabled =
                false;

            $("notes").disabled =
                false;

            $("projectFiles").disabled =
                false;

            document
                .querySelectorAll("[data-dynamic-field]")
                .forEach(control => {
                    control.disabled = false;
                });

        }

    }
);


/* =================================
   CANCEL
================================= */

$("cancel").addEventListener(
    "click",
    function() {

        try {

            ZOHO.CRM.UI.Popup.close();

        }

        catch (e) {

            window.close();

        }

    }
);


/* =================================
   INITIALIZE ZOHO SDK
================================= */

$("debug").textContent =
    "Initializing Zoho CRM SDK...";

ZOHO.embeddedApp
    .init()
    .then(function() {

        debug(
            "SDK INITIALIZED",
            "Success"
        );

    })
    .catch(function(error) {

        debug(
            "SDK INITIALIZATION ERROR",
            error
        );

    });

</script>

</body>
</html>
